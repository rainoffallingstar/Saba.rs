[package]
name = "ryusei-host"
version.workspace = true
description = "UI-independent Ryusei application workflows"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
encoding_rs = "0.8.35"
gif = "0.14"
keyring = "3"
png = "0.17"
ryusei-domain-core = { path = "../domain-core" }
ryusei-plugin-runtime = { path = "../plugin-runtime" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
ureq = "3"
url = "2.5.8"
uuid = { version = "1.24", features = ["v4"] }

[dev-dependencies]
wat = "1.226"
