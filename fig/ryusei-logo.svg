<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Ryusei logo</title>
  <desc id="desc">A bright orange meteor with a flowing blue, violet and magenta tail.</desc>
  <defs>
    <linearGradient id="tail" x1="58" y1="86" x2="400" y2="414" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16D9F2"/>
      <stop offset=".32" stop-color="#176BFF"/>
      <stop offset=".62" stop-color="#7A20F4"/>
      <stop offset=".84" stop-color="#F21CA8"/>
      <stop offset="1" stop-color="#FF5B32"/>
    </linearGradient>
    <linearGradient id="tailHighlight" x1="92" y1="105" x2="390" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A8FBFF"/>
      <stop offset=".46" stop-color="#6DD8FF"/>
      <stop offset=".78" stop-color="#FF8DE1"/>
      <stop offset="1" stop-color="#FFE36D"/>
    </linearGradient>
    <radialGradient id="head" cx="34%" cy="28%" r="82%">
      <stop offset="0" stop-color="#FFF59A"/>
      <stop offset=".28" stop-color="#FFD52F"/>
      <stop offset=".64" stop-color="#FF851C"/>
      <stop offset="1" stop-color="#E52B27"/>
    </radialGradient>
    <linearGradient id="headEdge" x1="330" y1="260" x2="478" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFEF62"/>
      <stop offset=".52" stop-color="#FF9A1F"/>
      <stop offset="1" stop-color="#D71C32"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Main flowing tail: compact at app-icon sizes, expressive at large sizes. -->
  <path d="M58 76C128 155 180 188 266 218C188 188 111 183 48 151C111 221 181 258 283 278C207 271 124 286 65 320C160 315 236 333 317 368C246 346 173 356 110 405C208 388 288 404 356 438C298 391 253 329 244 269C229 198 163 135 58 76Z" fill="url(#tail)" filter="url(#softGlow)"/>
  <path d="M75 104C145 171 198 202 280 233C205 201 141 199 86 181C148 235 208 257 292 278C225 265 167 277 119 303C189 299 245 315 302 341C257 319 215 313 174 321C221 337 267 361 304 389C266 347 238 302 236 260C232 204 168 148 75 104Z" fill="url(#tailHighlight)" opacity=".72"/>

  <!-- Secondary flame ribbons create the rainbow identity without fine detail. -->
  <path d="M183 139C246 178 291 207 342 239C299 197 266 166 227 126C260 181 309 228 374 269C318 232 271 215 226 213C276 247 319 282 356 320C321 270 270 222 183 139Z" fill="#F21CA8" opacity=".9"/>
  <path d="M118 364C188 337 246 349 325 393C267 358 222 321 197 274C223 326 268 384 344 438C276 395 202 374 118 364Z" fill="#FF3E78" opacity=".88"/>

  <!-- Meteor head. -->
  <path d="M328 207C382 212 450 250 480 314C509 376 494 439 449 472C404 505 337 487 299 447C263 409 252 347 274 291C286 260 303 232 328 207Z" fill="url(#headEdge)" opacity=".96"/>
  <path d="M340 220C392 227 442 258 466 313C489 366 477 421 438 452C400 482 344 465 311 429C281 396 272 346 291 300C302 270 320 240 340 220Z" fill="url(#head)"/>

  <!-- Craters and restrained highlights. -->
  <ellipse cx="365" cy="347" rx="30" ry="42" transform="rotate(24 365 347)" fill="#B93624" opacity=".7"/>
  <ellipse cx="422" cy="309" rx="16" ry="23" transform="rotate(28 422 309)" fill="#C74420" opacity=".68"/>
  <ellipse cx="420" cy="403" rx="18" ry="27" transform="rotate(30 420 403)" fill="#B92B2C" opacity=".7"/>
  <ellipse cx="331" cy="403" rx="13" ry="19" transform="rotate(25 331 403)" fill="#C53A25" opacity=".6"/>
  <path d="M332 254C354 233 391 234 417 249C382 244 354 257 338 285C329 300 321 319 315 339C312 303 317 274 332 254Z" fill="#FFF9B1" opacity=".8"/>
  <ellipse cx="389" cy="267" rx="14" ry="9" transform="rotate(28 389 267)" fill="#fff" opacity=".72"/>
</svg>
