<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Ryusei logo</title>
  <desc id="desc">A black Go stone as a meteor head, trailing a cyan-to-magenta comet tail over a faint go board.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#182136"/>
      <stop offset="0.55" stop-color="#0e1422"/>
      <stop offset="1" stop-color="#070a12"/>
    </radialGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse" x="31" y="31">
      <path d="M25 0 L25 25 M0 25 L25 25" stroke="#7aa2ff" stroke-width="1" opacity="0.05"/>
    </pattern>
    <linearGradient id="tail" x1="96" y1="432" x2="332" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#37e0ff"/>
      <stop offset="0.35" stop-color="#2f6bff"/>
      <stop offset="0.68" stop-color="#8b3bff"/>
      <stop offset="1" stop-color="#ff3fa8"/>
    </linearGradient>
    <radialGradient id="stone" cx="38%" cy="30%" r="72%">
      <stop offset="0" stop-color="#5b6475"/>
      <stop offset="0.32" stop-color="#1a1e28"/>
      <stop offset="0.72" stop-color="#0c0e15"/>
      <stop offset="1" stop-color="#20242f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6fd7ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6fd7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Faint 19x19 go board with star points. -->
  <rect x="31" y="31" width="450" height="450" fill="url(#grid)"/>
  <g fill="#9cc0ff">
    <circle cx="106" cy="106" r="5" opacity="0.30"/>
    <circle cx="256" cy="106" r="5" opacity="0.30"/>
    <circle cx="406" cy="106" r="5" opacity="0.30"/>
    <circle cx="106" cy="256" r="5" opacity="0.30"/>
    <circle cx="256" cy="256" r="5" opacity="0.30"/>
    <circle cx="406" cy="256" r="5" opacity="0.30"/>
    <circle cx="106" cy="406" r="5" opacity="0.30"/>
    <circle cx="256" cy="406" r="5" opacity="0.30"/>
    <circle cx="406" cy="406" r="5" opacity="0.30"/>
  </g>

  <!-- Soft glow behind the meteor head. -->
  <circle cx="322" cy="198" r="150" fill="url(#glow)"/>

  <!-- Comet tail: a tapered gradient ribbon trailing to the lower left. -->
  <path d="M88 430 Q180 384 262 308 L300 344 Q210 418 118 458 Z" fill="url(#tail)"/>
  <path d="M112 420 Q188 384 258 318 L274 330 Q204 394 140 434 Z" fill="#37e0ff" opacity="0.35"/>

  <!-- Meteor head: a black go stone with a crisp specular highlight. -->
  <circle cx="322" cy="198" r="102" fill="url(#stone)"/>
  <ellipse cx="288" cy="156" rx="34" ry="20" transform="rotate(-24 288 156)" fill="#ffffff" opacity="0.82"/>
  <ellipse cx="312" cy="140" rx="11" ry="6" transform="rotate(-24 312 140)" fill="#ffffff" opacity="0.55"/>
  <path d="M232 240 A102 102 0 0 0 300 298 A96 96 0 0 1 236 246 Z" fill="#5f9bff" opacity="0.20"/>
</svg>
