# Ryusei Flatpak manifest. Build with:
# flatpak-builder --user --force-clean --repo=flatpak-repo build-dir flatpak/dev.ryusei.app.yml
app-id: dev.ryusei.app
runtime: org.freedesktop.Platform//24.08
sdk: org.freedesktop.Sdk//24.08
command: ryusei

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-config/ryusei:create
  - --filesystem=xdg-config/ryusei-gpui:create

modules:
  - name: ryusei
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/ryusei/cargo-home
        CARGO_TARGET_DIR: /run/build/ryusei/target
    build-commands:
      - cargo build --release --locked -p ryusei-gpui --bin ryusei
      - install -Dm755 target/release/ryusei /app/bin/ryusei
      - install -Dm644 LICENSE.md /app/share/licenses/ryusei/LICENSE.md
      - install -Dm644 flatpak/dev.ryusei.app.desktop /app/share/applications/dev.ryusei.app.desktop
      - install -Dm644 flatpak/dev.ryusei.app.xml /app/share/mime/packages/dev.ryusei.app.xml
    sources:
      - type: dir
        path: ..
