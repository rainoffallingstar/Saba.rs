<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ryusei</title>
  <desc id="desc">Ryusei: a native, GPU-rendered Go board and SGF editor. A black Go stone trails a cyan-to-magenta comet tail over a faint go board.</desc>
  <defs>
    <radialGradient id="bg" cx="62%" cy="40%" r="82%">
      <stop offset="0" stop-color="#162033"/>
      <stop offset="0.55" stop-color="#0d1320"/>
      <stop offset="1" stop-color="#070a12"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse" x="756" y="34">
      <path d="M26 0 L26 26 M0 26 L26 26" stroke="#7aa2ff" stroke-width="1" opacity="0.06"/>
    </pattern>
    <linearGradient id="tail" x1="820" y1="300" x2="986" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#37e0ff"/>
      <stop offset="0.35" stop-color="#2f6bff"/>
      <stop offset="0.68" stop-color="#8b3bff"/>
      <stop offset="1" stop-color="#ff3fa8"/>
    </linearGradient>
    <radialGradient id="stone" cx="38%" cy="30%" r="72%">
      <stop offset="0" stop-color="#5b6475"/>
      <stop offset="0.32" stop-color="#1a1e28"/>
      <stop offset="0.72" stop-color="#0c0e15"/>
      <stop offset="1" stop-color="#20242f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6fd7ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6fd7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>

  <!-- Right side: faint go board + meteor-stone motif. -->
  <rect x="756" y="34" width="392" height="292" rx="14" fill="url(#grid)"/>
  <g fill="#9cc0ff">
    <circle cx="830" cy="108" r="4" opacity="0.30"/>
    <circle cx="960" cy="108" r="4" opacity="0.30"/>
    <circle cx="1090" cy="108" r="4" opacity="0.30"/>
    <circle cx="830" cy="180" r="4" opacity="0.30"/>
    <circle cx="960" cy="180" r="4" opacity="0.30"/>
    <circle cx="1090" cy="180" r="4" opacity="0.30"/>
    <circle cx="830" cy="252" r="4" opacity="0.30"/>
    <circle cx="960" cy="252" r="4" opacity="0.30"/>
    <circle cx="1090" cy="252" r="4" opacity="0.30"/>
  </g>

  <circle cx="984" cy="150" r="128" fill="url(#glow)"/>
  <path d="M812 292 Q872 252 918 190 L944 214 Q894 272 836 306 Z" fill="url(#tail)"/>
  <path d="M828 286 Q874 256 916 200 L928 208 Q886 264 848 296 Z" fill="#37e0ff" opacity="0.35"/>
  <circle cx="984" cy="150" r="82" fill="url(#stone)"/>
  <ellipse cx="957" cy="117" rx="27" ry="16" transform="rotate(-24 957 117)" fill="#ffffff" opacity="0.82"/>
  <ellipse cx="976" cy="105" rx="9" ry="5" transform="rotate(-24 976 105)" fill="#ffffff" opacity="0.55"/>
  <path d="M912 184 A82 82 0 0 0 966 231 A77 77 0 0 1 915 189 Z" fill="#5f9bff" opacity="0.20"/>

  <!-- Left side: category, title, tagline, metadata. -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="56" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2" fill="#8e9bb3">GO · BADUK · WEIQI — NATIVE BOARD &amp; SGF EDITOR</text>

    <text x="54" y="186" font-size="92" font-weight="700" fill="#ffffff">Ryusei<tspan font-size="40" font-weight="400" fill="#8e9bb3">  流星</tspan></text>

    <text x="56" y="236" font-size="25" fill="#c3ccdd">A native, GPU-rendered Go board and SGF editor</text>
    <text x="56" y="270" font-size="25" fill="#c3ccdd">with deep KataGo analysis and a plugin workbench.</text>

    <g font-size="18" font-weight="600" fill="#ffffff">
      <rect x="56" y="296" width="86" height="36" rx="18" fill="#0071e3"/>
      <text x="99" y="320" text-anchor="middle" fill="#ffffff">Rust</text>
      <rect x="152" y="296" width="92" height="36" rx="18" fill="#232c40"/>
      <text x="198" y="320" text-anchor="middle" fill="#c3ccdd">GPUI</text>
      <rect x="254" y="296" width="98" height="36" rx="18" fill="#232c40"/>
      <text x="303" y="320" text-anchor="middle" fill="#c3ccdd">Metal</text>
    </g>
  </g>
</svg>
