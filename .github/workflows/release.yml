name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify vendored GPUI patch contract
        shell: bash
        run: ./scripts/verify-gpui-patch.sh
      - name: Set release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=$(./scripts/release-version.sh)" >> "$GITHUB_ENV"
          fi
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes build-essential pkg-config libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev
      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Build release binary
        run: cargo build --release --locked -p ryusei-gpui --bin ryusei

      - name: Package macOS app and dmg
        if: runner.os == 'macOS'
        run: ./scripts/bundle-macos.sh
      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ryusei-macos
          path: |
            dist/macos/*.app
            dist/macos/*.dmg

      - name: Package Linux tarball
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/linux
          cp target/release/ryusei dist/linux/ryusei
          cp README.md LICENSE.md dist/linux/
          tar -czf "dist/linux/ryusei-v${APP_VERSION}-linux-x86_64.tar.gz" -C dist/linux ryusei README.md LICENSE.md
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: ./scripts/bundle-linux-appimage.sh
      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ryusei-linux
          path: dist/linux/*

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item target/release/ryusei.exe dist/windows/ryusei.exe
          Copy-Item README.md, LICENSE.md dist/windows/
          Compress-Archive -Path dist/windows/ryusei.exe, dist/windows/README.md, dist/windows/LICENSE.md -DestinationPath "dist/windows/ryusei-v$env:APP_VERSION-windows-x86_64.zip" -Force
      - name: Package Windows installer (NSIS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # NSIS through chocolatey with retries: the community feed has
          # been intermittently 503 on CI, and sourceforge direct links
          # serve HTML in this environment. choco --attempts retries the
          # whole install.
          choco install nsis --yes --no-progress --attempts=5 --random-wait
          if (Get-Command makensis.exe -ErrorAction SilentlyContinue) {
            $makensis = (Get-Command makensis.exe).Source
          } else {
            $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          }
          & $makensis /DAPP_VERSION=$env:APP_VERSION /DROOT_DIR=$env:GITHUB_WORKSPACE scripts\installer.nsi
      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ryusei-windows
          path: dist/windows/*

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify vendored GPUI patch contract
        shell: bash
        run: ./scripts/verify-gpui-patch.sh
      - name: Set release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=$(./scripts/release-version.sh)" >> "$GITHUB_ENV"
          fi
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.freedesktop.Sdk.Extension.rust-stable//24.08
      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --force-clean --repo=flatpak-repo build-dir flatpak/dev.ryusei.app.yml
          flatpak build-bundle flatpak-repo "ryusei-v${APP_VERSION}-linux-x86_64.flatpak" dev.ryusei.app
      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: ryusei-flatpak
          path: ryusei-v*-linux-x86_64.flatpak

  publish:
    needs: [release, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Strip bundle directories from release assets
        run: find artifacts -maxdepth 2 -name '*.app' -type d -exec rm -rf {} +
      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
