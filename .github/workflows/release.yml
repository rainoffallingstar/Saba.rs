name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes build-essential pkg-config libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev
      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Build release binary
        run: cargo build --release -p sabaki-gpui

      - name: Package macOS app and dmg
        if: runner.os == 'macOS'
        run: ./scripts/bundle-macos.sh
      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: saba-rs-macos
          path: |
            dist/macos/*.app
            dist/macos/*.dmg

      - name: Package Linux tarball
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/linux
          cp target/release/sabaki-gpui dist/linux/saba-rs
          cp README.md LICENSE.md dist/linux/
          tar -czf dist/linux/saba-rs-linux-x86_64.tar.gz -C dist/linux saba-rs README.md LICENSE.md
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: ./scripts/bundle-linux-appimage.sh
      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: saba-rs-linux
          path: dist/linux/*

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item target/release/sabaki-gpui.exe dist/windows/saba-rs.exe
          Copy-Item README.md, LICENSE.md dist/windows/
          Compress-Archive -Path dist/windows/saba-rs.exe, dist/windows/README.md, dist/windows/LICENSE.md -DestinationPath dist/windows/saba-rs-windows-x86_64.zip -Force
      - name: Package Windows installer (NSIS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Portable NSIS from the official mirror; avoids the chocolatey
          # feed which has been flaky (503s) on CI.
          $nsisVersion = '3.12.0'
          $nsisZip = "$env:RUNNER_TEMP\nsis.zip"
          $nsisDir = "$env:RUNNER_TEMP\nsis"
          Invoke-WebRequest -Uri "https://downloads.sourceforge.net/project/nsis/NSIS%203/$nsisVersion/nsis-$nsisVersion.zip" -OutFile $nsisZip
          New-Item -ItemType Directory -Force $nsisDir | Out-Null
          tar -xf $nsisZip -C $nsisDir
          $makensis = Get-ChildItem -Path $nsisDir -Recurse -Filter makensis.exe | Select-Object -First 1 -ExpandProperty FullName
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.1.0' }
          & $makensis /DAPP_VERSION=$version /DROOT_DIR=$env:GITHUB_WORKSPACE scripts\installer.nsi
      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: saba-rs-windows
          path: dist/windows/*

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.freedesktop.Sdk.Extension.rust-stable//24.08
      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --force-clean --repo=flatpak-repo build-dir flatpak/dev.saba-rs.app.yml
          flatpak build-bundle flatpak-repo saba-rs-linux-x86_64.flatpak dev.sabars.app
      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: saba-rs-flatpak
          path: saba-rs-linux-x86_64.flatpak

  publish:
    needs: [release, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Strip bundle directories from release assets
        run: find artifacts -maxdepth 2 -name '*.app' -type d -exec rm -rf {} +
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
