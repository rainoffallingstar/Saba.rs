[package]
name = "sabaki-gpui"
version.workspace = true
description = "The native Saba.rs client built on GPUI"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "saba-rs"
path = "src/main.rs"

[dependencies]
gpui = { version = "0.2.2", features = ["font-kit", "macos-blade"] }
rfd = "0.17.2"
sabaki-domain-core = { path = "../../crates/domain-core" }
sabaki-host = { path = "../../crates/sabaki-host" }
sabaki-plugin-runtime = { path = "../../crates/plugin-runtime" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["font-kit", "macos-blade", "test-support"] }
rand = "0.9"
