[package]
name = "ryusei-gpui"
version.workspace = true
description = "The native Ryusei client built on GPUI"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ryusei"
path = "src/main.rs"

[dependencies]
gpui = { version = "0.2.2", features = ["font-kit", "macos-blade"] }
gpui-component = "=0.5.1"
rfd = "0.17.2"
ryusei-domain-core = { path = "../../crates/domain-core" }
ryusei-host = { path = "../../crates/ryusei-host" }
ryusei-plugin-runtime = { path = "../../crates/plugin-runtime" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["font-kit", "macos-blade", "test-support"] }
rand = "0.9"
