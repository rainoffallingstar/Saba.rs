[workspace]
members = [
  "crates/domain-core",
  "crates/plugin-runtime",
  "crates/ryusei-host",
  "apps/ryusei-gpui",
]
resolver = "2"
exclude = ["vendor/gpui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ryusei Contributors"]
license = "MIT"
repository = "https://github.com/rainoffallingstar/ryusei"

