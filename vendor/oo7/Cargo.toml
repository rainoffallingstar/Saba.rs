[package]
edition = "2024"
rust-version = "1.85"
name = "oo7"
version = "0.5.0"
authors = [
    "Bilal Elmoussaoui",
    "Sophie Herold",
    "Maximiliano Sandoval",
]
build = false
exclude = ["org.freedesktop.Secrets.xml"]
autolib = false
autobins = false
autoexamples = false
autotests = false
