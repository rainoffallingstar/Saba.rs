tokio = [
    "zbus/tokio",
    "dep:tokio",
    "ashpd/tokio",
]
tracing = [
    "dep:tracing",
    "ashpd/tracing",
]
unstable = []

[lib]
name = "oo7"
path = "src/lib.rs"

[[example]]
