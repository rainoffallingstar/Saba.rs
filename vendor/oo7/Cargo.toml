rustc-args = [
    "--cfg",
    "docsrs",
]
rustdoc-args = [
    "--cfg",
    "docsrs",
    "--generate-link-to-definition",
]

[features]
async-std = [
    "zbus/async-io",
    "dep:async-fs",
    "dep:async-io",
    "dep:async-lock",
    "dep:blocking",
    "dep:futures-lite",
    "ashpd/async-std",
]
default = [
    "local_tests",
    "tokio",
    "native_crypto",
]
local_tests = []
native_crypto = [
    "dep:aes",
    "dep:cbc",
    "dep:cipher",
    "dep:digest",
    "dep:hkdf",
    "dep:hmac",
    "dep:md-5",
    "dep:pbkdf2",
    "dep:sha2",
    "dep:subtle",
]
